services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    # Mount host AWS credentials so boto3 can reach real AWS
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    # Default run scrapes the live feed; override per invocation, e.g.:
    #   docker compose run --rm scraper all --since 2026-01-01
    #   docker compose run --rm scraper archive 2021-2025 --limit 100
    command: ["current"]

  # HTTP trigger mode:  docker compose up scraper-api
  # then POST /scrape (e.g. {"mode": "all", "since": "2026-01-01"}), GET /status
  scraper-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    command: ["serve"]
    ports:
      - "8080:8080"
